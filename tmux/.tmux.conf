# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# 鼠标支持
set -g mouse on

# appearance
set -g status on
set -g status-position bottom
set -g status-interval 5

# neutral dark
set -g status-style "bg=#1e1e1e,fg=#a0a0a0"

# keep content short
set -g status-left-length 20
set -g status-right-length 30

# minimal segments
set -g status-left " #S "
set -g status-right " %H:%M "

# windows: plain + subtle highlight
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#1e1e1e,bg=#c0c0c0,bold] #I:#W "

set -g window-status-style "fg=#8a8a8a,bg=#1e1e1e"
set -g window-status-current-style "fg=#1e1e1e,bg=#c0c0c0"